[project]
name = "helmetd-voice"
version = "0.1.0"
description = "ElevenLabs conversation, spoken alerts, and Helmetd's LLM gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
  "helmetd-llm",
  "elevenlabs>=2.70,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
audio = ["pyaudio>=0.2.14,<0.3"]

[project.scripts]
helmetd-voice = "helmetd_voice.cli:main"

[tool.uv.sources]
helmetd-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
