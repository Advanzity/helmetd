[project]
name = "helmetd-hazards"
version = "0.1.0"
description = "Signed shared road-hazard reports on Solana devnet"
requires-python = ">=3.12,<3.15"
dependencies = ["httpx>=0.28,<1", "solders>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
helmetd-hazards = "helmetd_hazards.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
